<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>Recharge — Polestar 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Estimateur de temps de recharge — Polestar 2 Long Range Dual Motor 2021.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recharge">
<meta name="theme-color" content="#FAFAF8">
<meta name="color-scheme" content="light">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-180.png">
<style>
:root{
  --bg:#FAFAF8;
  --ink:#1A1A1A;
  --muted:#8C8C86;
  --rule:#E4E4DE;
  --accent:#FF7A00;
  --accent-soft:#FFF2E5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Inter","Helvetica Neue",Arial,sans-serif;
  font-weight:400;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
.wrap{
  max-width:480px;
  margin:0 auto;
  padding:max(24px,env(safe-area-inset-top)) 20px calc(64px + env(safe-area-inset-bottom));
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- header ---------- */
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
.head h1{
  margin:0;font-size:12px;font-weight:400;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}
.icon-btn{
  width:40px;height:40px;margin:-8px -8px -8px 0;
  display:flex;align-items:center;justify-content:center;color:var(--muted);
}
.icon-btn:active{color:var(--ink)}
.icon-btn svg{width:20px;height:20px;display:block}

/* ---------- blocks ---------- */
.block{padding:28px 0}
.block:first-of-type{padding-top:0}
.block + .block{border-top:1px solid var(--rule)}
.lbl{
  margin:0 0 12px;font-size:12px;font-weight:400;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);
}
.sub{font-size:13px;font-weight:300;color:var(--muted);margin:0}

/* ---------- stepper ---------- */
.soc + .soc{margin-top:28px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stepper .val{font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1}
.stepper .val .pct{font-size:20px;font-weight:300;color:var(--muted);margin-left:4px;letter-spacing:0}
.step{
  width:52px;height:52px;flex:0 0 52px;border:1px solid var(--rule);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:300;
  line-height:1;color:var(--ink);background:var(--bg);
}
.step:active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step:disabled{color:var(--rule);border-color:var(--rule);background:var(--bg)}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:32px;margin:4px 0 0;
  background:transparent;display:block;
}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--rule)}
input[type=range]::-moz-range-track{height:1px;background:var(--rule)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--ink);margin-top:-10.5px;border:0;
}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--ink);border:0}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.chip{
  border:1px solid var(--rule);border-radius:2px;padding:8px 14px;
  font-size:13px;font-weight:400;color:var(--muted);
}
.chip:active{border-color:var(--ink);color:var(--ink)}

/* ---------- segmented ---------- */
.seg{display:grid;gap:8px}
.seg-2{grid-template-columns:repeat(2,1fr)}
.seg-3{grid-template-columns:repeat(3,1fr)}
.seg button{
  border:1px solid var(--rule);border-radius:2px;padding:12px 8px;text-align:left;
  display:block;background:var(--bg);
}
.seg .t{display:block;font-size:14px;font-weight:400;line-height:1.25}
.seg .h{display:block;font-size:11px;font-weight:300;color:var(--muted);margin-top:2px}
.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg button[aria-pressed=true] .h{color:rgba(250,250,248,.62)}
.seg-3 button{text-align:center;padding:12px 4px}

/* ---------- toggles ---------- */
.tgl{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0}
.tgl + .tgl{border-top:1px solid var(--rule)}
.tgl .t{font-size:14px}
.tgl .h{font-size:12px;font-weight:300;color:var(--muted);margin-top:2px}
.switch{
  flex:0 0 46px;width:46px;height:28px;border:1px solid var(--rule);border-radius:14px;
  position:relative;transition:background .16s,border-color .16s;background:var(--bg);
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:var(--muted);transition:transform .16s,background .16s;
}
.switch[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
.switch[aria-pressed=true]::after{transform:translateX(18px);background:#fff}
.tgl[hidden]{display:none}
.tgl.off{opacity:.4;pointer-events:none}

/* ---------- result ---------- */
.result{padding:32px 0 0;border-top:1px solid var(--rule)}
.duration{
  font-size:clamp(52px,15vw,68px);font-weight:600;letter-spacing:-.03em;line-height:1;
  margin:0;
}
.duration.small{font-size:clamp(26px,7.5vw,34px);letter-spacing:-.01em;line-height:1.15}
.ready{margin:16px 0 0;font-size:19px;font-weight:300}
.ready b{font-weight:600;color:var(--accent)}
.meta{margin:8px 0 0;font-size:13px;font-weight:300;color:var(--muted)}

.banner{
  background:var(--accent-soft);border-left:2px solid var(--accent);
  padding:14px 16px;margin:0 0 24px;font-size:13px;font-weight:400;line-height:1.5;
}
.banner b{font-weight:600}
.banner p{margin:0}
.banner p + p{margin-top:8px}

.disclose{
  margin-top:32px;border-top:1px solid var(--rule);padding-top:16px;
  font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:8px;width:100%;
}
.disclose .car{transition:transform .16s;font-size:10px}
.disclose[aria-expanded=true] .car{transform:rotate(90deg)}
.detail{padding-top:8px}
.detail[hidden]{display:none}
.row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;font-size:14px;font-weight:300}
.row + .row{border-top:1px solid var(--rule)}
.row .k{color:var(--muted)}
.row .v{font-weight:400}
.tranches{margin-top:20px}
.tranches .lbl{margin-bottom:8px}
.bar{display:flex;align-items:center;gap:12px;padding:6px 0;font-size:13px;font-weight:300}
.bar .rng{flex:0 0 76px;color:var(--muted)}
.bar .track{flex:1;height:2px;background:var(--rule);display:block}
.bar .fill{display:block;height:2px;background:var(--accent)}
.bar .tm{flex:0 0 60px;text-align:right}

/* ---------- config ---------- */
.cfg-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
.cfg-head h1{margin:0;font-size:12px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.link{font-size:14px;font-weight:400;color:var(--accent)}
.field{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0}
.field + .field{border-top:1px solid var(--rule)}
.field .k{font-size:14px;font-weight:300}
.field .k small{display:block;font-size:11px;color:var(--muted)}
.field input{
  flex:0 0 96px;width:96px;text-align:right;background:var(--bg);
  border:0;border-bottom:1px solid var(--rule);padding:6px 2px;font-size:15px;
  font-variant-numeric:tabular-nums;border-radius:0;
}
.field input:focus{outline:none;border-bottom-color:var(--accent)}
.field .pair{display:flex;gap:12px;flex:0 0 auto}
.field .pair input{flex:0 0 72px;width:72px}
.cfg-actions{display:flex;flex-direction:column;gap:12px;margin-top:32px}
.btn{
  border:1px solid var(--ink);border-radius:2px;padding:14px;text-align:center;font-size:14px;
}
.btn:active{background:var(--ink);color:var(--bg)}
.btn.quiet{border-color:var(--rule);color:var(--muted)}
.btn.quiet:active{background:var(--bg);border-color:var(--ink);color:var(--ink)}
.saved{font-size:13px;font-weight:300;color:var(--accent);text-align:center;margin:16px 0 0;min-height:20px}
[hidden]{display:none !important}
</style>
</head>
<body>

<div class="wrap" id="view-main">
  <header class="head">
    <h1>Polestar 2 · Recharge</h1>
    <button class="icon-btn" id="open-cfg" aria-label="Réglages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.1"/>
        <path d="M12 1.9l1.5 2.1 2.5-.6.7 2.5 2.5.7-.6 2.5 2.1 1.5-2.1 1.5.6 2.5-2.5.7-.7 2.5-2.5-.6L12 22.1l-1.5-2.1-2.5.6-.7-2.5-2.5-.7.6-2.5L3.3 13.4l2.1-1.5-.6-2.5 2.5-.7.7-2.5 2.5.6z"/>
      </svg>
    </button>
  </header>

  <section class="block">
    <div class="soc">
      <h2 class="lbl">Je suis à</h2>
      <div class="stepper">
        <button class="step" data-step="start" data-dir="-1" aria-label="Diminuer">−</button>
        <div class="val num"><span id="v-start">20</span><span class="pct">%</span></div>
        <button class="step" data-step="start" data-dir="1" aria-label="Augmenter">+</button>
      </div>
      <input type="range" id="r-start" min="0" max="99" step="1" value="20" aria-label="Niveau de charge actuel">
    </div>

    <div class="soc">
      <h2 class="lbl">Je veux</h2>
      <div class="stepper">
        <button class="step" data-step="target" data-dir="-1" aria-label="Diminuer">−</button>
        <div class="val num"><span id="v-target">80</span><span class="pct">%</span></div>
        <button class="step" data-step="target" data-dir="1" aria-label="Augmenter">+</button>
      </div>
      <input type="range" id="r-target" min="1" max="100" step="1" value="80" aria-label="Niveau de charge visé">
      <div class="chips">
        <button class="chip" data-add="10">+10</button>
        <button class="chip" data-add="20">+20</button>
        <button class="chip" data-set="80">80 %</button>
        <button class="chip" data-set="90">90 %</button>
      </div>
    </div>
  </section>

  <section class="block">
    <h2 class="lbl">Borne</h2>
    <div class="seg seg-2" id="presets"></div>

    <div style="margin-top:20px">
      <div class="tgl" id="tgl-split-row">
        <div>
          <div class="t">Borne partagée</div>
          <div class="h">Deux véhicules branchés — puissance divisée</div>
        </div>
        <button class="switch" id="tgl-split" role="switch" aria-pressed="false" aria-label="Borne partagée"></button>
      </div>
      <div class="tgl" id="tgl-pre-row">
        <div>
          <div class="t">Préchauffage batterie</div>
          <div class="h">Navigation vers la borne lancée 20–30 min avant</div>
        </div>
        <button class="switch" id="tgl-pre" role="switch" aria-pressed="false" aria-label="Préchauffage batterie"></button>
      </div>
    </div>
  </section>

  <section class="block">
    <h2 class="lbl">Température</h2>
    <div class="seg seg-3" id="temps"></div>
  </section>

  <section class="result">
    <div id="banner-slot"></div>
    <p class="duration num" id="duration">—</p>
    <p class="ready" id="ready"></p>
    <p class="meta" id="meta"></p>
    <p class="meta" id="cap-note" hidden></p>

    <button class="disclose" id="disclose" aria-expanded="false" aria-controls="detail">
      <span class="car">▶</span><span>Détail</span>
    </button>
    <div class="detail" id="detail" hidden></div>
  </section>
</div>

<div class="wrap" id="view-cfg" hidden>
  <header class="cfg-head">
    <h1>Réglages</h1>
    <button class="link" id="close-cfg">Terminé</button>
  </header>
  <div id="cfg-body"></div>
  <div class="cfg-actions">
    <button class="btn" id="cfg-export">Exporter la configuration</button>
    <button class="btn" id="cfg-import">Importer une configuration</button>
    <button class="btn quiet" id="cfg-reset">Réinitialiser aux défauts</button>
  </div>
  <p class="saved" id="cfg-saved"></p>
  <input type="file" id="cfg-file" accept="application/json,.json" hidden>
</div>

<script>
"use strict";

/* ============================================================
   Défauts — Polestar 2 2021 Long Range Dual Motor Performance
   ============================================================ */
const DEFAULTS = {
  capacity: 75,        // kWh utilisables (78 bruts)
  acMax: 11,           // chargeur AC embarqué, kW
  lossAC: 10,          // %
  lossDC: 5,           // %
  splitRatio: 50,      // % de la puissance quand la borne est partagée
  presets: [
    { id:'maison',  name:'Maison — niveau 2', hint:'48 A',  type:'ac', nominal:11,  factor:0.95 },
    { id:'chalet',  name:'Chalet — 120 V',    hint:'prise', type:'ac', nominal:1.2, factor:0.85 },
    { id:'ce-l2',   name:'CE — Niveau 2',     hint:'public',type:'ac', nominal:7.2, factor:0.95, ce:true },
    { id:'ce-50',   name:'CE — BRCC 50',      hint:'rapide',type:'dc', nominal:50,  factor:0.85, ce:true },
    { id:'ce-100',  name:'CE — BRCC 100',     hint:'rapide',type:'dc', nominal:100, factor:0.85, ce:true },
    { id:'ce-180',  name:'CE — BRCC 180',     hint:'rapide',type:'dc', nominal:180, factor:0.85, ce:true }
  ],
  // Courbe d'acceptation de l'auto, borne ≥ 150 kW, batterie tempérée
  curve: [
    { from:0,  to:30,  kw:147 },
    { from:30, to:50,  kw:120 },
    { from:50, to:65,  kw:95 },
    { from:65, to:75,  kw:70 },
    { from:75, to:85,  kw:45 },
    { from:85, to:90,  kw:28 },
    { from:90, to:100, kw:12 }
  ],
  // Du plus chaud au plus froid — le préchauffage remonte de `precondSteps` crans
  temps: [
    { id:'ete',    label:'Été',        hint:'> 15 °C',    dcMult:1,   dcCap:0,  acMult:1 },
    { id:'frais',  label:'Frais',      hint:'5 à 15 °C',  dcMult:0.9, dcCap:0,  acMult:1 },
    { id:'froid',  label:'Froid',      hint:'−10 à 5 °C', dcMult:1,   dcCap:70, acMult:0.9 },
    { id:'tfroid', label:'Très froid', hint:'−20 à −10 °C',dcMult:1,  dcCap:40, acMult:0.75 },
    { id:'extreme',label:'Extrême',    hint:'< −20 °C',   dcMult:1,   dcCap:25, acMult:0.6, killsTrickle:true }
  ],
  precondSteps: 2,
  trickleMax: 2,       // kW — en dessous, la borne est traitée comme une prise 120 V
  roundTo: 5           // minutes, arrondi supérieur
};

const CFG_KEY = 'recharge.config.v1';
const UI_KEY  = 'recharge.ui.v1';

/* ============================================================
   Configuration : chargement / fusion / persistance
   ============================================================ */
function clone(o){ return JSON.parse(JSON.stringify(o)); }

function loadConfig(){
  const cfg = clone(DEFAULTS);
  let raw;
  try { raw = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch(e){ raw = null; }
  if (!raw || typeof raw !== 'object') return cfg;

  ['capacity','acMax','lossAC','lossDC','splitRatio','precondSteps','trickleMax','roundTo']
    .forEach(k => { if (isFinite(raw[k])) cfg[k] = Number(raw[k]); });

  if (Array.isArray(raw.presets)) cfg.presets.forEach(p => {
    const s = raw.presets.find(x => x && x.id === p.id);
    if (!s) return;
    if (isFinite(s.nominal)) p.nominal = Number(s.nominal);
    if (isFinite(s.factor))  p.factor  = Number(s.factor);
  });

  if (Array.isArray(raw.curve)) cfg.curve.forEach((seg, i) => {
    const s = raw.curve[i];
    if (s && isFinite(s.kw)) seg.kw = Number(s.kw);
  });

  if (Array.isArray(raw.temps)) cfg.temps.forEach(t => {
    const s = raw.temps.find(x => x && x.id === t.id);
    if (!s) return;
    ['dcMult','dcCap','acMult'].forEach(k => { if (isFinite(s[k])) t[k] = Number(s[k]); });
  });

  return cfg;
}

function saveConfig(cfg){
  localStorage.setItem(CFG_KEY, JSON.stringify({
    capacity:cfg.capacity, acMax:cfg.acMax, lossAC:cfg.lossAC, lossDC:cfg.lossDC,
    splitRatio:cfg.splitRatio, precondSteps:cfg.precondSteps, trickleMax:cfg.trickleMax,
    roundTo:cfg.roundTo,
    presets: cfg.presets.map(p => ({ id:p.id, nominal:p.nominal, factor:p.factor })),
    curve:   cfg.curve.map(s => ({ kw:s.kw })),
    temps:   cfg.temps.map(t => ({ id:t.id, dcMult:t.dcMult, dcCap:t.dcCap, acMult:t.acMult }))
  }));
}

let CFG = loadConfig();

/* ============================================================
   Modèle
   ============================================================ */

// Puissance acceptée par l'auto à un SOC donné (segment contenant ce SOC).
function curveKw(soc, curve){
  for (const s of curve) if (soc < s.to) return s.kw;
  return curve[curve.length - 1].kw;
}

// Le préchauffage remonte l'état thermique de `precondSteps` crans vers le chaud.
function effectiveTempIndex(idx, precond, cfg){
  return precond ? Math.max(0, idx - cfg.precondSteps) : idx;
}

/**
 * Intègre la courbe par pas de 1 % de SOC.
 * Le temps se calcule sur l'énergie nette entrant dans la batterie ;
 * les pertes ne servent qu'à afficher les kWh facturés par la borne.
 */
function estimate(o){
  const cfg = o.cfg;
  const preset = cfg.presets.find(p => p.id === o.presetId) || cfg.presets[0];
  const temp = cfg.temps[o.tempIdx] || cfg.temps[0];
  const dcTemp = cfg.temps[effectiveTempIndex(o.tempIdx, o.precond, cfg)] || temp;
  const isDC = preset.type === 'dc';
  const trickle = preset.nominal <= cfg.trickleMax;

  const start = Math.min(o.start, o.target);
  const target = Math.max(o.start, o.target);

  // Puissance disponible côté borne
  const splitFactor = (o.split && isSplittable(preset)) ? cfg.splitRatio / 100 : 1;
  let station = preset.nominal * splitFactor * preset.factor;
  if (!isDC) station *= temp.acMult;              // le préchauffage n'aide pas en AC
  if (!isDC) station = Math.min(station, cfg.acMax);

  const dead = !isDC && trickle && temp.killsTrickle;   // 120 V par grand froid : rien n'entre
  if (dead || station <= 0) {
    return { dead:true, preset, temp, isDC, trickle, start, target };
  }

  const cap = isDC && dcTemp.dcCap > 0 ? dcTemp.dcCap : Infinity;
  const stepKwh = cfg.capacity * 0.01;

  let hours = 0, hoursTo90 = 0, hoursAfter90 = 0, capped = false;
  const decades = new Map();

  for (let soc = start; soc < target; soc++){
    const carKw = isDC ? curveKw(soc, cfg.curve) * dcTemp.dcMult : cfg.acMax;
    const kw = Math.min(carKw, station, cap);
    if (kw <= 0) return { dead:true, preset, temp, isDC, trickle, start, target };
    if (isDC && cap < Math.min(carKw, station)) capped = true;

    const h = stepKwh / kw;
    hours += h;
    if (soc < 90) hoursTo90 += h; else hoursAfter90 += h;

    const d = Math.floor(soc / 10) * 10;
    decades.set(d, (decades.get(d) || 0) + h);
  }

  const kwhBattery = (target - start) * stepKwh;
  const loss = (isDC ? cfg.lossDC : cfg.lossAC) / 100;
  const kwhBilled = loss < 1 ? kwhBattery / (1 - loss) : kwhBattery;

  return {
    dead:false, preset, temp, isDC, trickle, start, target, capped,
    stationKw: station,
    capKw: cap === Infinity ? null : cap,
    hours, hoursTo90, hoursAfter90,
    kwhBattery, kwhBilled,
    avgKw: hours > 0 ? kwhBattery / hours : 0,
    decades: [...decades.entries()].map(([from, h]) => ({ from, hours:h })).sort((a,b) => a.from - b.from)
  };
}

function isSplittable(preset){ return preset.type === 'dc' && preset.nominal >= 100; }

function roundMinutes(hours, cfg){
  const m = hours * 60;
  return Math.ceil(m / cfg.roundTo) * cfg.roundTo;
}

/* ============================================================
   Formats (fr-CA)
   ============================================================ */
function fmtDuration(min){
  if (min <= 0) return '0 min';
  if (min < 60) return min + ' min';
  const d = Math.floor(min / 1440);
  if (d >= 1){
    const h = Math.round((min - d * 1440) / 60);
    return d + ' j ' + h + ' h';
  }
  const h = Math.floor(min / 60), m = min % 60;
  return m === 0 ? h + ' h' : h + ' h ' + String(m).padStart(2, '0');
}
function fmtClock(date){
  return date.getHours() + ' h ' + String(date.getMinutes()).padStart(2, '0');
}
function fmtNum(n, dec){
  return n.toLocaleString('fr-CA', { minimumFractionDigits:dec, maximumFractionDigits:dec });
}
function parseNum(v){
  const n = parseFloat(String(v).replace(',', '.'));
  return isFinite(n) ? n : null;
}

/* ============================================================
   État de l'écran
   ============================================================ */
function defaultTempIdx(){
  const m = new Date().getMonth();          // 0 = janvier
  if (m >= 5 && m <= 8) return 0;           // juin–septembre
  if (m === 4 || m === 9) return 1;         // mai, octobre
  if (m === 10 || m === 2 || m === 3) return 2; // novembre, mars, avril
  return 3;                                  // décembre–février
}

const S = {
  start: 20,
  target: 80,
  presetId: 'ce-100',
  tempIdx: defaultTempIdx(),
  split: false,
  precond: false
};

(function restoreUI(){
  let raw;
  try { raw = JSON.parse(localStorage.getItem(UI_KEY) || 'null'); } catch(e){ return; }
  if (!raw) return;
  if (CFG.presets.some(p => p.id === raw.presetId)) S.presetId = raw.presetId;
  if (isFinite(raw.target)) S.target = Math.min(100, Math.max(1, raw.target|0));
  if (S.target <= S.start) S.start = Math.max(0, S.target - 1);
})();

function saveUI(){
  try {
    localStorage.setItem(UI_KEY, JSON.stringify({ presetId:S.presetId, target:S.target }));
  } catch(e){ /* mode privé : tant pis */ }
}

/* ============================================================
   Rendu — écran principal
   ============================================================ */
const $ = id => document.getElementById(id);

function renderPresets(){
  $('presets').innerHTML = CFG.presets.map(p => {
    const kw = fmtNum(p.nominal, p.nominal % 1 ? 1 : 0);
    return '<button data-preset="' + p.id + '" aria-pressed="' + (p.id === S.presetId) + '">' +
      '<span class="t">' + p.name + '</span>' +
      '<span class="h">' + kw + ' kW · ' + p.hint + '</span></button>';
  }).join('');
}

function renderTemps(){
  $('temps').innerHTML = CFG.temps.map((t, i) =>
    '<button data-temp="' + i + '" aria-pressed="' + (i === S.tempIdx) + '">' +
      '<span class="t">' + t.label + '</span><span class="h">' + t.hint + '</span></button>'
  ).join('');
}

function render(){
  // SOC
  $('v-start').textContent = S.start;
  $('v-target').textContent = S.target;
  $('r-start').value = S.start;
  $('r-target').value = S.target;
  document.querySelectorAll('[data-step]').forEach(b => {
    const v = S[b.dataset.step], dir = +b.dataset.dir;
    b.disabled = (dir < 0 && v <= +($(b.dataset.step === 'start' ? 'r-start' : 'r-target').min))
              || (dir > 0 && v >= +($(b.dataset.step === 'start' ? 'r-start' : 'r-target').max));
  });

  // Contexte
  document.querySelectorAll('[data-preset]').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.preset === S.presetId));
  document.querySelectorAll('[data-temp]').forEach(b =>
    b.setAttribute('aria-pressed', +b.dataset.temp === S.tempIdx));

  const preset = CFG.presets.find(p => p.id === S.presetId) || CFG.presets[0];
  $('tgl-split-row').hidden = !isSplittable(preset);
  $('tgl-pre-row').classList.toggle('off', preset.type !== 'dc');
  $('tgl-split').setAttribute('aria-pressed', String(S.split));
  $('tgl-pre').setAttribute('aria-pressed', String(S.precond));

  renderResult();
}

function renderResult(){
  const r = estimate({
    cfg:CFG, presetId:S.presetId, tempIdx:S.tempIdx,
    split:S.split, precond:S.precond, start:S.start, target:S.target
  });

  const dur = $('duration'), ready = $('ready'), meta = $('meta'), slot = $('banner-slot');
  const capNote = $('cap-note');
  slot.innerHTML = '';
  $('detail').innerHTML = '';
  capNote.hidden = true;

  const collapse = () => {
    $('disclose').hidden = true;
    $('disclose').setAttribute('aria-expanded', 'false');
    $('detail').hidden = true;
  };

  if (r.dead){
    dur.className = 'duration num small';
    dur.textContent = 'Charge nette ≈ nulle';
    ready.innerHTML = '';
    meta.textContent = '';
    slot.innerHTML = '<div class="banner"><p><b>Aucune estimation possible.</b> ' +
      'À cette température, le chauffage de la batterie consomme autant que la prise fournit. ' +
      'Le niveau de charge ne montera pratiquement pas, peu importe la durée du branchement.</p></div>';
    collapse();
    return;
  }

  if (r.start === r.target){
    dur.className = 'duration num';
    dur.textContent = '0 min';
    ready.innerHTML = 'Déjà au niveau visé.';
    meta.textContent = '';
    collapse();
    return;
  }
  $('disclose').hidden = false;

  // Règle Circuit électrique > 90 %
  const ceRule = r.target > 90 && r.preset.ce && r.isDC;
  const totalMin = roundMinutes(r.hours, CFG);

  dur.className = 'duration num';
  dur.textContent = fmtDuration(totalMin);

  const back = new Date(Date.now() + totalMin * 60000);
  ready.innerHTML = 'Retour à <b class="num">' + fmtClock(back) + '</b>';

  const bits = [
    fmtNum(r.kwhBattery, 1) + ' kWh dans la batterie',
    fmtNum(r.avgKw, 0) + ' kW en moyenne'
  ];
  meta.textContent = bits.join(' · ');

  if (ceRule){
    const min90 = roundMinutes(r.hoursTo90, CFG);
    const extra = totalMin - min90;
    slot.innerHTML = '<div class="banner">' +
      '<p><b>Au-delà de 90 %, le Circuit électrique pénalise.</b> ' +
      'Tarification majorée et vitesse réduite au minimum — la borne reste occupée pour très peu d\'énergie.</p>' +
      '<p>Recommandé : <b class="num">' + fmtDuration(min90) + '</b> pour atteindre 90 % ' +
      '(retour à <b class="num">' + fmtClock(new Date(Date.now() + min90 * 60000)) + '</b>). ' +
      'Les ' + (r.target - 90) + ' % suivants coûtent <b class="num">' + fmtDuration(extra) + '</b> de plus.</p>' +
      '</div>';
  }

  if (r.capped){
    capNote.textContent = 'Puissance plafonnée à ' + fmtNum(r.capKw, 0) + ' kW par la température' +
      (S.precond ? ' malgré le préchauffage.' : ' — le préchauffage aiderait.');
    capNote.hidden = false;
  }

  renderDetail(r, totalMin);
}

function renderDetail(r, totalMin){
  const rows = [
    ['Énergie dans la batterie', fmtNum(r.kwhBattery, 1) + ' kWh'],
    ['Énergie facturée (' + (r.isDC ? CFG.lossDC : CFG.lossAC) + ' % de pertes)', fmtNum(r.kwhBilled, 1) + ' kWh'],
    ['Puissance moyenne', fmtNum(r.avgKw, 1) + ' kW'],
    ['Puissance de la borne', fmtNum(r.stationKw, 1) + ' kW' + (S.split && isSplittable(r.preset) ? ' (partagée)' : '')],
    ['Durée exacte', fmtDuration(Math.round(r.hours * 60)) + ' → arrondi à ' + fmtDuration(totalMin)]
  ];

  const maxH = Math.max.apply(null, r.decades.map(d => d.hours));
  const tranches = r.decades.map(d => {
    const to = Math.min(d.from + 10, r.target);
    const from = Math.max(d.from, r.start);
    const w = maxH > 0 ? Math.round(d.hours / maxH * 100) : 0;
    return '<div class="bar"><span class="rng num">' + from + '–' + to + ' %</span>' +
      '<span class="track"><span class="fill" style="width:' + w + '%"></span></span>' +
      '<span class="tm num">' + fmtDuration(Math.max(1, Math.round(d.hours * 60))) + '</span></div>';
  }).join('');

  $('detail').innerHTML =
    rows.map(([k, v]) => '<div class="row"><span class="k">' + k + '</span><span class="v num">' + v + '</span></div>').join('') +
    '<div class="tranches"><h3 class="lbl">Par tranche de 10 %</h3>' + tranches + '</div>';
}

/* ============================================================
   Interactions — écran principal
   ============================================================ */
function setSOC(which, value){
  const v = Math.max(0, Math.min(100, Math.round(value)));
  if (which === 'start'){
    S.start = Math.min(v, 99);
    if (S.target <= S.start) S.target = Math.min(100, S.start + 1);
  } else {
    S.target = Math.max(v, 1);
    if (S.start >= S.target) S.start = Math.max(0, S.target - 1);
  }
  saveUI();
  render();
}

function holdRepeat(el, fn){
  let timer = null, ticker = null;
  const stop = () => { clearTimeout(timer); clearInterval(ticker); timer = ticker = null; };
  el.addEventListener('pointerdown', e => {
    if (el.disabled) return;
    e.preventDefault();
    fn();
    timer = setTimeout(() => { ticker = setInterval(() => el.disabled ? stop() : fn(), 70); }, 420);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => el.addEventListener(ev, stop));
}

document.querySelectorAll('[data-step]').forEach(btn => {
  holdRepeat(btn, () => setSOC(btn.dataset.step, S[btn.dataset.step] + (+btn.dataset.dir)));
});
$('r-start').addEventListener('input', e => setSOC('start', +e.target.value));
$('r-target').addEventListener('input', e => setSOC('target', +e.target.value));

document.querySelectorAll('[data-add]').forEach(b =>
  b.addEventListener('click', () => setSOC('target', S.target + (+b.dataset.add))));
document.querySelectorAll('[data-set]').forEach(b =>
  b.addEventListener('click', () => setSOC('target', +b.dataset.set)));

$('presets').addEventListener('click', e => {
  const b = e.target.closest('[data-preset]');
  if (!b) return;
  S.presetId = b.dataset.preset;
  const p = CFG.presets.find(x => x.id === S.presetId);
  if (!isSplittable(p)) S.split = false;
  saveUI();
  render();
});

$('temps').addEventListener('click', e => {
  const b = e.target.closest('[data-temp]');
  if (!b) return;
  S.tempIdx = +b.dataset.temp;
  render();
});

$('tgl-split').addEventListener('click', () => { S.split = !S.split; render(); });
$('tgl-pre').addEventListener('click', () => { S.precond = !S.precond; render(); });

$('disclose').addEventListener('click', () => {
  const open = $('disclose').getAttribute('aria-expanded') === 'true';
  $('disclose').setAttribute('aria-expanded', String(!open));
  $('detail').hidden = open;
});

/* ============================================================
   Réglages
   ============================================================ */
function cfgRow(label, sub, value, onChange, opts){
  opts = opts || {};
  const wrap = document.createElement('div');
  wrap.className = 'field';
  const k = document.createElement('div');
  k.className = 'k';
  k.innerHTML = label + (sub ? '<small>' + sub + '</small>' : '');
  const input = document.createElement('input');
  input.type = 'text';
  input.inputMode = 'decimal';
  input.value = String(value).replace('.', ',');
  input.addEventListener('change', () => {
    const n = parseNum(input.value);
    if (n === null || (opts.min !== undefined && n < opts.min) || (opts.max !== undefined && n > opts.max)){
      input.value = String(value).replace('.', ',');
      return;
    }
    onChange(n);
    saveConfig(CFG);
    flashSaved();
    render();
  });
  wrap.append(k, input);
  return wrap;
}

function cfgSection(title, note){
  const h = document.createElement('h2');
  h.className = 'lbl';
  h.style.marginTop = '32px';
  h.innerHTML = title + (note ? ' <span style="text-transform:none;letter-spacing:0;font-weight:300">— ' + note + '</span>' : '');
  return h;
}

function renderConfig(){
  const body = $('cfg-body');
  body.innerHTML = '';

  body.append(cfgSection('Véhicule'));
  body.append(cfgRow('Capacité utilisable', 'kWh', CFG.capacity, v => CFG.capacity = v, { min:1, max:200 }));
  body.append(cfgRow('Chargeur AC embarqué', 'kW', CFG.acMax, v => CFG.acMax = v, { min:0.5, max:50 }));
  body.append(cfgRow('Pertes AC', '%', CFG.lossAC, v => CFG.lossAC = v, { min:0, max:60 }));
  body.append(cfgRow('Pertes DC', '%', CFG.lossDC, v => CFG.lossDC = v, { min:0, max:60 }));

  body.append(cfgSection('Bornes', 'nominal kW · facteur réel'));
  CFG.presets.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'field';
    const k = document.createElement('div');
    k.className = 'k';
    k.innerHTML = p.name + '<small>' + (p.type === 'dc' ? 'courant continu' : 'courant alternatif') + '</small>';
    const pair = document.createElement('div');
    pair.className = 'pair';
    [['nominal', 0.1, 400], ['factor', 0.1, 1]].forEach(([key, min, max]) => {
      const i = document.createElement('input');
      i.type = 'text'; i.inputMode = 'decimal';
      i.value = String(p[key]).replace('.', ',');
      i.setAttribute('aria-label', p.name + ' — ' + (key === 'nominal' ? 'puissance nominale' : 'facteur réel'));
      i.addEventListener('change', () => {
        const n = parseNum(i.value);
        if (n === null || n < min || n > max){ i.value = String(p[key]).replace('.', ','); return; }
        p[key] = n;
        saveConfig(CFG); flashSaved(); renderPresets(); render();
      });
      pair.append(i);
    });
    wrap.append(k, pair);
    body.append(wrap);
  });
  body.append(cfgRow('Borne partagée', '% de la puissance conservée', CFG.splitRatio, v => CFG.splitRatio = v, { min:1, max:100 }));

  body.append(cfgSection('Courbe DC', 'kW acceptés par l\'auto'));
  CFG.curve.forEach(seg => {
    body.append(cfgRow(seg.from + ' – ' + seg.to + ' %', 'kW', seg.kw, v => seg.kw = v, { min:1, max:400 }));
  });

  body.append(cfgSection('Température', 'plafond DC (kW, 0 = aucun) · facteur AC'));
  CFG.temps.forEach(t => {
    const wrap = document.createElement('div');
    wrap.className = 'field';
    const k = document.createElement('div');
    k.className = 'k';
    k.innerHTML = t.label + '<small>' + t.hint + (t.dcMult !== 1 ? ' · courbe ×' + String(t.dcMult).replace('.', ',') : '') + '</small>';
    const pair = document.createElement('div');
    pair.className = 'pair';
    [['dcCap', 0, 400], ['acMult', 0, 1]].forEach(([key, min, max]) => {
      const i = document.createElement('input');
      i.type = 'text'; i.inputMode = 'decimal';
      i.value = String(t[key]).replace('.', ',');
      i.setAttribute('aria-label', t.label + ' — ' + (key === 'dcCap' ? 'plafond DC' : 'facteur AC'));
      i.addEventListener('change', () => {
        const n = parseNum(i.value);
        if (n === null || n < min || n > max){ i.value = String(t[key]).replace('.', ','); return; }
        t[key] = n;
        saveConfig(CFG); flashSaved(); renderTemps(); render();
      });
      pair.append(i);
    });
    wrap.append(k, pair);
    body.append(wrap);
  });
  body.append(cfgRow('Préchauffage', 'crans de remontée thermique', CFG.precondSteps, v => CFG.precondSteps = Math.round(v), { min:0, max:4 }));

  body.append(cfgSection('Affichage'));
  body.append(cfgRow('Arrondi de la durée', 'minutes', CFG.roundTo, v => CFG.roundTo = Math.max(1, Math.round(v)), { min:1, max:30 }));
}

let savedTimer;
function flashSaved(msg){
  $('cfg-saved').textContent = msg || 'Enregistré';
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => { $('cfg-saved').textContent = ''; }, 1600);
}

$('open-cfg').addEventListener('click', () => {
  renderConfig();
  $('view-main').hidden = true;
  $('view-cfg').hidden = false;
  window.scrollTo(0, 0);
});
$('close-cfg').addEventListener('click', () => {
  $('view-cfg').hidden = true;
  $('view-main').hidden = false;
  window.scrollTo(0, 0);
});

$('cfg-reset').addEventListener('click', () => {
  if (!confirm('Réinitialiser tous les réglages aux valeurs par défaut ?')) return;
  localStorage.removeItem(CFG_KEY);
  CFG = loadConfig();
  renderConfig(); renderPresets(); renderTemps(); render();
  flashSaved('Réinitialisé');
});

$('cfg-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(CFG, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'recharge-config.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  flashSaved('Exporté');
});

$('cfg-import').addEventListener('click', () => $('cfg-file').click());
$('cfg-file').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      localStorage.setItem(CFG_KEY, JSON.stringify(parsed));
      CFG = loadConfig();
      renderConfig(); renderPresets(); renderTemps(); render();
      flashSaved('Importé');
    } catch(err){
      flashSaved('Fichier illisible');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

/* ============================================================
   Démarrage
   ============================================================ */
renderPresets();
renderTemps();
render();

// L'heure de retour vieillit — on la rafraîchit à la minute et au retour d'arrière-plan.
setInterval(renderResult, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderResult(); });

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
