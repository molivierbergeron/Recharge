name: Déploiement GitHub Pages

# GitHub Pages sert la branche `gh-pages`. Ce workflow y republie le site à
# chaque push sur la branche par défaut.
on:
  push:
    branches:
      - claude/polestar-charge-estimator-pp0lsk
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Republier la racine sur gh-pages
        run: |
          set -euo pipefail

          # `.github` est retiré du site publié : le jeton du workflow n'a pas
          # le droit d'écrire des fichiers de workflow sur une autre branche,
          # et le site n'en a aucun besoin.
          rm -rf .github

          # Pas de Jekyll : le site est déjà du HTML statique.
          touch .nojekyll

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Un commit orphelin par déploiement : gh-pages reste un miroir du
          # site, sans traîner l'historique du dépôt.
          git checkout --orphan deploiement
          git add -A
          git commit -m "Déploiement de ${GITHUB_SHA:0:7}"
          git push --force origin deploiement:refs/heads/gh-pages
